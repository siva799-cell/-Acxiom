<div class="dropdown user-menu">
  <button class="btn user-menu-trigger" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="User menu">
    <span class="avatar" aria-hidden="true">{{ request.user.get_full_name|default:request.user.username|first|upper }}</span>
    <i class="bi bi-chevron-down" aria-hidden="true"></i>
  </button>
  <div class="dropdown-menu dropdown-menu-end user-dropdown">
    <div class="user-dropdown-heading">
      <strong>{{ request.user.get_full_name|default:request.user.username }}</strong>
      <span>{{ request.user.email|default:"Email not provided" }}</span>
      <span class="role-badge mt-2">{{ crm_role_label }}</span>
    </div>
    <a class="dropdown-item" href="{% url 'dashboard:home' %}#profile-summary"><i class="bi bi-person me-2" aria-hidden="true"></i>Profile</a>
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button class="dropdown-item text-danger" type="submit"><i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Sign out</button>
    </form>
  </div>
</div>
