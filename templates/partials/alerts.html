{% if messages %}
  <div class="alerts-stack" aria-live="polite" aria-atomic="true">
    {% for message in messages %}
      <div class="alert alert-dismissible fade show {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'warning' %}alert-warning{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %}" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
